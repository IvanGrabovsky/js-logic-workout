name: Autograding & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: templates/js-logic-workout/package.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run Vitest
        run: npm test
